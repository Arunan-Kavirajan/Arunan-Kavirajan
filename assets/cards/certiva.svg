<rect x="1" y="1" width="578" height="238" rx="18" fill="#0a0d1a"/>
<g clip-path="url(#c)"><rect width="580" height="240" fill="url(#r)"/>
<text class="n" x="558" y="104" text-anchor="end">03</text></g>
<rect x="1" y="1" width="578" height="238" rx="18" fill="none" stroke="#fff" stroke-opacity=".09"/>
<rect x="1.5" y="1.5" width="577" height="237" rx="18" fill="none" stroke="url(#g)" stroke-width="2.5" stroke-linecap="round" pathLength="1000" stroke-dasharray="170 830">
<animate attributeName="stroke-dashoffset" from="0" to="-1000" dur="6s" repeatCount="indefinite"/></rect>
<rect x="28" y="26" width="78" height="24" rx="12" fill="#22c55e" fill-opacity=".12" stroke="#22c55e" stroke-opacity=".5"/>
<circle cx="43" cy="38" r="4" fill="#22c55e"><animate attributeName="opacity" values="1;.2;1" dur="1.6s" repeatCount="indefinite"/></circle>
