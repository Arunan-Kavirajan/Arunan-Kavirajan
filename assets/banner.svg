<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="100%" role="img" aria-label="Arunan Kavirajan, full-stack engineer">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#101a33"/></linearGradient>
<linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".05"/></pattern>
<radialGradient id="glow" cx=".85" cy=".1" r=".7"><stop offset="0" stop-color="#38bdf8" stop-opacity=".28"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
</defs>
<style>
text{font-family:"JetBrains Mono","SF Mono",Consolas,"DejaVu Sans Mono",monospace}
.name{font-size:68px;font-weight:800;fill:url(#ac);font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;letter-spacing:-1px}
.pre{font-size:16px;fill:#64748b}
.sub{font-size:22px;fill:#cbd5e1}
.tag{font-size:14px;fill:#94a3b8}
.cur{animation:b 1s steps(1) infinite}@keyframes b{50%{opacity:0}}
.in{animation:i .9s ease .1s backwards}@keyframes i{from{opacity:0;transform:translateY(8px)}}
</style>
<rect width="1200" height="260" rx="14" fill="url(#bg)"/>
<rect width="1200" height="260" rx="14" fill="url(#grid)"/>
<rect width="1200" height="260" rx="14" fill="url(#glow)"/>
<rect x="0.5" y="0.5" width="1199" height="259" rx="14" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
<g class="in">
<text x="64" y="74" class="pre">~/arunan $ whoami</text>
<text x="62" y="146" class="name">Arunan Kavirajan</text>
<text x="64" y="188" class="sub" opacity="1">Full-stack products, shipped end to end<animate attributeName="opacity" keyTimes="0.0000;0.2350;0.2500;1.0000" values="1;1;0;0" dur="16s" repeatCount="indefinite"/></text>
<text x="64" y="188" class="sub" opacity="0">TypeScript · Python · Flutter<animate attributeName="opacity" keyTimes="0.0000;0.2500;0.2650;0.4850;0.5000;1.0000" values="0;0;1;1;0;0" dur="16s" repeatCount="indefinite"/></text>
<text x="64" y="188" class="sub" opacity="0">AI-integrated tools with deterministic foundations<animate attributeName="opacity" keyTimes="0.0000;0.5000;0.5150;0.7350;0.7500;1.0000" values="0;0;1;1;0;0" dur="16s" repeatCount="indefinite"/></text>
<text x="64" y="188" class="sub" opacity="0">From messy workflows to clean software<animate attributeName="opacity" keyTimes="0.0000;0.7500;0.7650;0.9850;1.0000" values="0;0;1;1;0" dur="16s" repeatCount="indefinite"/></text>
<rect class="cur" x="64" y="214" width="10" height="18" fill="#38bdf8"/>
<text x="84" y="229" class="tag">IT undergrad @ SRMIST · Chennai, India</text>
</g>
<g transform="translate(980 60)" fill="none" stroke="url(#ac)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".9">
<path d="M40 30 L0 80 L40 130"/><path d="M130 30 L170 80 L130 130"/><path d="M95 10 L75 150"/>
</g>
</svg>